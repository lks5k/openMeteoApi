<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta del Clima</title>
    <style>
        /* Un diseño rápido y limpio para que se vea genial */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            width: 300px;
        }
        h1 { margin-top: 0; color: #333; font-size: 24px; }
        .temp { font-size: 48px; font-weight: bold; color: #007bff; margin: 10px 0; }
        .error { color: #dc3545; font-weight: bold; }
        .loading { color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="card">
        <h1 id="nombre-ciudad">Cargando...</h1>
        <div id="resultado-clima">
            <p class="loading">Buscando datos del clima...</p>
        </div>
    </div>

    <script>
        // Tu función asíncrona (se mantiene exactamente igual)
        async function obtenerClima(nombreCiudad) {
            try {
                const geocodingURL = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(nombreCiudad)}&count=1&language=es&format=json`;
                const geocodingResponse = await fetch(geocodingURL);

                if (!geocodingResponse.ok) {
                    throw new Error(`Error en la consulta de geolocalización: ${geocodingResponse.status}`);
                }

                const geocodingData = await geocodingResponse.json();

                if (!geocodingData.results || geocodingData.results.length === 0) {
                    throw new Error(`No se encontró la ciudad "${nombreCiudad}".`);
                }

                const ciudad = geocodingData.results[0].name;
                const latitud = geocodingData.results[0].latitude;
                const longitud = geocodingData.results[0].longitude;

                const weatherURL = `https://api.open-meteo.com/v1/forecast?latitude=${latitud}&longitude=${longitud}&current=temperature_2m,weather_code`;
                const weatherResponse = await fetch(weatherURL);

                if (!weatherResponse.ok) {
                    throw new Error(`Error en la consulta del clima: ${weatherResponse.status}`);
                }

                const weatherData = await weatherResponse.json();

                return {
                    ciudad: ciudad,
                    temperatura: `${weatherData.current.temperature_2m} °C`,
                    codigo_clima: `${weatherData.current.weather_code}`,
                };
            } catch (error) {
                console.error("Ocurrió un error:", error.message);
                throw error;
            }
        }

        // =========================================================
        // NUEVA PARTE: MOSTRAR LOS DATOS EN LA PÁGINA WEB (DOM)
        // =========================================================
        
        // 1. Obtenemos los elementos del HTML mediante su ID
        const contenedorCiudad = document.getElementById("nombre-ciudad");
        const contenedorResultado = document.getElementById("resultado-clima");

        // 2. Llamamos a la función
        obtenerClima("Cali")
            .then((resultado) => {
                // Modificamos el contenido del HTML con los datos reales
                contenedorCiudad.textContent = resultado.ciudad;
                contenedorResultado.innerHTML = `
                    <div class="temp">${resultado.temperatura}</div>
                    <p>Código de estado climático: ${resultado.codigo_clima}</p>
                `;
            })
            .catch((error) => {
                // Si algo falla, mostramos el error en la pantalla de forma amigable
                contenedorCiudad.textContent = "¡Ups!";
                contenedorResultado.innerHTML = `<p class="error">${error.message}</p>`;
            });
    </script>

</body>
</html>
