<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard del Clima</title>
    <style>
        /* ===== RESET Y BASE ===== */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            /* Degradado profundo que contrasta con el contenedor glassmorphism */
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
        }

        /* ===== TARJETA PRINCIPAL — GLASSMORPHISM ===== */
        .dashboard {
            background: rgba(255, 255, 255, 0.11);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.14);
            width: 100%;
            max-width: 820px;
            padding: 32px;
            color: white;
        }

        /* ===== BARRA DE BÚSQUEDA ===== */
        .search-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
        }

        .search-input {
            flex: 1;
            padding: 12px 22px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.09);
            color: white;
            font-size: 15px;
            outline: none;
            transition: border-color 0.25s, background 0.25s;
        }

        .search-input::placeholder { color: rgba(255, 255, 255, 0.45); }

        .search-input:focus {
            border-color: rgba(255, 255, 255, 0.55);
            background: rgba(255, 255, 255, 0.17);
        }

        .btn-location {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 11px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.22);
            background: rgba(255, 255, 255, 0.09);
            color: white;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.25s, transform 0.12s;
        }

        .btn-location:hover  { background: rgba(255, 255, 255, 0.2); }
        .btn-location:active { transform: scale(0.97); }

        .btn-location svg { width: 18px; height: 18px; flex-shrink: 0; }

        /* ===== CUERPO PRINCIPAL: DOS COLUMNAS ===== */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-bottom: 24px;
            align-items: center;
        }

        /* ===== COLUMNA IZQUIERDA: CLIMA ACTUAL ===== */
        .current-weather { display: flex; flex-direction: column; }

        .city-name    { font-size: 26px; font-weight: 700; letter-spacing: 0.3px; line-height: 1.2; }
        .current-date { font-size: 13px; color: rgba(255,255,255,0.6); margin: 5px 0 18px; }
        .weather-emoji    { font-size: 70px; line-height: 1; margin-bottom: 8px; }
        .temperature-main {
            font-size: 72px;
            font-weight: 800;
            color: #60b4ff;
            line-height: 1;
            letter-spacing: -3px;
        }
        .weather-description {
            font-size: 17px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.82);
            margin-top: 10px;
        }

        /* ===== COLUMNA DERECHA: DETALLES 2×2 ===== */
        .details-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .detail-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            transition: background 0.2s;
        }
        .detail-card:hover { background: rgba(255, 255, 255, 0.14); }

        .detail-label { font-size: 11px; color: rgba(255,255,255,0.5); text-transform: uppercase; letter-spacing: 0.9px; }
        .detail-icon  { font-size: 22px; }
        .detail-value { font-size: 22px; font-weight: 700; }
        .detail-sub   { font-size: 12px; font-weight: 400; opacity: 0.65; }

        /* ===== PRONÓSTICO 5 DÍAS ===== */
        .forecast-section {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
        }

        .forecast-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.3px;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 14px;
        }

        .forecast-row {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
        }

        .forecast-card {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            transition: background 0.2s, transform 0.15s;
        }
        .forecast-card:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }

        .forecast-day      { font-size: 11px; font-weight: 600; color: rgba(255,255,255,0.65); text-transform: uppercase; letter-spacing: 0.5px; }
        .forecast-emoji    { font-size: 28px; }
        .forecast-temp-max { font-size: 16px; font-weight: 700; }
        .forecast-temp-min { font-size: 13px; color: rgba(255,255,255,0.5); }

        /* ===== ESTADOS DE UI ===== */
        .loading-overlay {
            text-align: center;
            padding: 50px 0;
            color: rgba(255, 255, 255, 0.65);
            font-style: italic;
            font-size: 16px;
        }

        .error-msg {
            color: #ff8080;
            font-weight: 600;
            text-align: center;
            padding: 20px;
            font-size: 15px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 620px) {
            .main-content  { grid-template-columns: 1fr; }
            .forecast-row  { gap: 7px; }
            .forecast-card { padding: 10px 5px; }
            .forecast-emoji { font-size: 22px; }
            .temperature-main { font-size: 56px; }
            /* Oculta texto del botón GPS en pantallas pequeñas */
            .btn-location span { display: none; }
            .btn-location { padding: 11px 14px; }
        }
    </style>
</head>
<body>

    <div class="dashboard">

        <!-- Fila superior: búsqueda + botón GPS -->
        <div class="search-row">
            <input
                type="text"
                id="search-input"
                class="search-input"
                placeholder="Buscar ciudad…"
                autocomplete="off"
                spellcheck="false"
            />
            <button id="btn-gps" class="btn-location" title="Usar ubicación actual por GPS">
                <!-- Icono de mira (crosshair) SVG inline -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <circle cx="12" cy="12" r="9"/>
                    <line x1="12" y1="2"  x2="12" y2="6"/>
                    <line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="2"  y1="12" x2="6"  y2="12"/>
                    <line x1="18" y1="12" x2="22" y2="12"/>
                </svg>
                <span>Usar ubicación actual</span>
            </button>
        </div>

        <!-- Cuerpo del dashboard (se inyecta dinámicamente) -->
        <div id="dashboard-body">
            <div class="loading-overlay">Detectando tu ubicación…</div>
        </div>

    </div>

    <script>
        // ============================================================
        //  DICCIONARIO WMO — Códigos de clima a texto en ES + emoji
        //  Referencia: https://open-meteo.com/en/docs#weathervariables
        // ============================================================
        const WMO_CODES = {
            0:  { texto: 'Cielo despejado',          emoji: '☀️'  },
            1:  { texto: 'Mayormente despejado',      emoji: '🌤️' },
            2:  { texto: 'Parcialmente nublado',      emoji: '⛅'  },
            3:  { texto: 'Cubierto',                  emoji: '☁️'  },
            45: { texto: 'Niebla',                    emoji: '🌫️' },
            48: { texto: 'Niebla con escarcha',       emoji: '🌫️' },
            51: { texto: 'Llovizna ligera',           emoji: '🌦️' },
            53: { texto: 'Llovizna moderada',         emoji: '🌦️' },
            55: { texto: 'Llovizna intensa',          emoji: '🌧️' },
            56: { texto: 'Llovizna helada ligera',    emoji: '🌧️' },
            57: { texto: 'Llovizna helada densa',     emoji: '🌧️' },
            61: { texto: 'Lluvia ligera',             emoji: '🌧️' },
            63: { texto: 'Lluvia moderada',           emoji: '🌧️' },
            65: { texto: 'Lluvia intensa',            emoji: '🌧️' },
            66: { texto: 'Lluvia helada ligera',      emoji: '🌨️' },
            67: { texto: 'Lluvia helada intensa',     emoji: '🌨️' },
            71: { texto: 'Nevada ligera',             emoji: '❄️'  },
            73: { texto: 'Nevada moderada',           emoji: '❄️'  },
            75: { texto: 'Nevada intensa',            emoji: '❄️'  },
            77: { texto: 'Granizo fino',              emoji: '🌨️' },
            80: { texto: 'Chubascos ligeros',         emoji: '🌦️' },
            81: { texto: 'Chubascos moderados',       emoji: '🌧️' },
            82: { texto: 'Chubascos muy intensos',    emoji: '⛈️'  },
            85: { texto: 'Nieve en chubascos',        emoji: '❄️'  },
            86: { texto: 'Nieve intensa en chubascos',emoji: '❄️'  },
            95: { texto: 'Tormenta eléctrica',        emoji: '⛈️'  },
            96: { texto: 'Tormenta con granizo',      emoji: '⛈️'  },
            99: { texto: 'Tormenta severa con granizo',emoji: '⛈️' },
        };

        /** Resuelve un código WMO; devuelve fallback genérico si no está mapeado. */
        function resolverCodigo(codigo) {
            return WMO_CODES[codigo] ?? { texto: `Estado ${codigo}`, emoji: '🌡️' };
        }

        // ============================================================
        //  UTILIDADES DE FECHA
        // ============================================================
        const DIAS        = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
        const DIAS_CORTOS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        const MESES       = ['enero','febrero','marzo','abril','mayo','junio',
                             'julio','agosto','septiembre','octubre','noviembre','diciembre'];

        /**
         * Formatea "YYYY-MM-DD" → "Lunes, 21 de mayo de 2026".
         * Se fuerza mediodía UTC para evitar desfases de zona horaria.
         */
        function formatearFechaLarga(fechaISO) {
            const d = new Date(fechaISO + 'T12:00:00Z');
            return `${DIAS[d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]} de ${d.getUTCFullYear()}`;
        }

        /** Devuelve el nombre corto del día a partir de "YYYY-MM-DD". */
        function diaCorto(fechaISO) {
            const d = new Date(fechaISO + 'T12:00:00Z');
            return DIAS_CORTOS[d.getUTCDay()];
        }

        // ============================================================
        //  CAPA DE DATOS
        // ============================================================

        // ── Utilidades de parsing para la geocodificación inteligente ──

        /**
         * Separa la consulta en término de búsqueda y pista de país.
         * "Hawaii, USA"  → { termino: "Hawaii", paisHint: "USA" }
         * "Paris"        → { termino: "Paris",  paisHint: null  }
         */
        function parsearConsulta(consulta) {
            const partes = consulta.split(',').map(p => p.trim());
            return { termino: partes[0], paisHint: partes[1] ?? null };
        }

        /** Normaliza un string para comparación: minúsculas, sin tildes ni puntuación. */
        function normalizar(str) {
            return str.toLowerCase()
                      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                      .replace(/[^a-z0-9\s]/g, '')
                      .trim();
        }

        /**
         * Alias de nombres y abreviaturas comunes → código ISO 3166-1 alpha-2.
         * Permite al usuario escribir "Hawaii, USA", "Paris, FR", "Bogotá, Colombia", etc.
         */
        const PAIS_ALIAS = {
            'us': 'US', 'usa': 'US', 'eeuu': 'US', 'estados unidos': 'US', 'united states': 'US',
            'gb': 'GB', 'uk': 'GB', 'reino unido': 'GB', 'united kingdom': 'GB', 'england': 'GB',
            'mx': 'MX', 'mexico': 'MX',
            'co': 'CO', 'colombia': 'CO',
            'ar': 'AR', 'argentina': 'AR',
            'cl': 'CL', 'chile': 'CL',
            'pe': 'PE', 'peru': 'PE',
            've': 'VE', 'venezuela': 'VE',
            'ec': 'EC', 'ecuador': 'EC',
            'bo': 'BO', 'bolivia': 'BO',
            'py': 'PY', 'paraguay': 'PY',
            'uy': 'UY', 'uruguay': 'UY',
            'gt': 'GT', 'guatemala': 'GT',
            'es': 'ES', 'espana': 'ES', 'spain': 'ES',
            'fr': 'FR', 'france': 'FR', 'francia': 'FR',
            'de': 'DE', 'germany': 'DE', 'alemania': 'DE',
            'it': 'IT', 'italy': 'IT', 'italia': 'IT',
            'pt': 'PT', 'portugal': 'PT',
            'br': 'BR', 'brazil': 'BR', 'brasil': 'BR',
            'ca': 'CA', 'canada': 'CA',
            'au': 'AU', 'australia': 'AU',
            'jp': 'JP', 'japan': 'JP', 'japon': 'JP',
            'cn': 'CN', 'china': 'CN',
            'in': 'IN', 'india': 'IN',
            'ru': 'RU', 'russia': 'RU', 'rusia': 'RU',
        };

        /**
         * Resuelve una pista de país a un código ISO de 2 letras, o null si no reconoce.
         * Acepta tanto el código directamente ("US") como nombres en español o inglés.
         */
        function resolverCodigoPais(hint) {
            if (!hint) return null;
            const norm = normalizar(hint);
            // Coincidencia directa con código de 2 letras
            if (/^[a-z]{2}$/.test(norm)) return norm.toUpperCase();
            return PAIS_ALIAS[norm] ?? null;
        }

        /**
         * Geocodifica un nombre de ciudad usando la API de Open-Meteo.
         * Solicita hasta 5 candidatos, filtra por país si el usuario escribió una coma,
         * y elige el resultado con mayor población para evitar ambigüedades.
         * @returns {{ ciudad, pais, latitud, longitud }}
         */
        async function geocodificarCiudad(consulta) {
            const { termino, paisHint } = parsearConsulta(consulta);
            const codigoPais = resolverCodigoPais(paisHint);

            const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(termino)}&count=5&language=es&format=json`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Error de geocodificación: ${res.status}`);
            const datos = await res.json();
            if (!datos.results?.length) throw new Error(`No se encontró la ciudad "${termino}".`);

            let candidatos = datos.results;

            // Si el usuario especificó un país, filtrar primero por ese código ISO.
            // Si el filtro no produce resultados (código desconocido), se mantienen todos.
            if (codigoPais) {
                const filtrados = candidatos.filter(r => r.country_code === codigoPais);
                if (filtrados.length > 0) candidatos = filtrados;
            }

            // Desempatar por población: el lugar más habitado suele ser el más buscado.
            // La API puede omitir el campo; se usa 0 como fallback.
            candidatos.sort((a, b) => (b.population ?? 0) - (a.population ?? 0));

            const mejor = candidatos[0];
            return {
                ciudad:   mejor.name,
                pais:     mejor.country ?? '',
                latitud:  mejor.latitude,
                longitud: mejor.longitude,
            };
        }

        /**
         * Consulta el clima actual + pronóstico de 5 días para unas coordenadas.
         * Parámetros actuales: temperatura, código de clima, humedad, sensación
         * térmica, velocidad del viento e índice UV.
         * @returns {Promise<Object>} Respuesta cruda de Open-Meteo
         */
        async function obtenerClimaPorCoordenadas(latitud, longitud) {
            const params = new URLSearchParams({
                latitude:      latitud,
                longitude:     longitud,
                current:       'temperature_2m,weather_code,relative_humidity_2m,apparent_temperature,wind_speed_10m,uv_index',
                daily:         'weather_code,temperature_2m_max,temperature_2m_min',
                forecast_days: 5,
                timezone:      'auto',
            });
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
            if (!res.ok) throw new Error(`Error al obtener el clima: ${res.status}`);
            return res.json();
        }

        /**
         * Flujo completo por nombre: geocodifica → obtiene clima.
         * @returns {{ ubicacion, datos }}
         */
        async function obtenerClima(nombreCiudad) {
            const ubicacion = await geocodificarCiudad(nombreCiudad);
            const datos     = await obtenerClimaPorCoordenadas(ubicacion.latitud, ubicacion.longitud);
            return { ubicacion, datos };
        }

        /**
         * Geocodificación inversa con Nominatim (OSM) para el botón GPS.
         * Devuelve el nombre de la ciudad más cercana a las coordenadas.
         */
        async function ciudadDesdeCoordenadas(lat, lon) {
            const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=es`;
            const res = await fetch(url, { headers: { 'Accept-Language': 'es' } });
            if (!res.ok) throw new Error('Geocodificación inversa fallida');
            const d = await res.json();
            return d.address?.city
                || d.address?.town
                || d.address?.village
                || d.address?.municipality
                || 'Tu ubicación';
        }

        // ============================================================
        //  CAPA DE RENDERIZADO
        // ============================================================
        const dashboardBody = document.getElementById('dashboard-body');

        function mostrarCargando(msg = 'Cargando datos del clima…') {
            dashboardBody.innerHTML = `<div class="loading-overlay">${msg}</div>`;
        }

        function mostrarError(msg) {
            dashboardBody.innerHTML = `<p class="error-msg">⚠️ ${msg}</p>`;
        }

        /**
         * Construye e inyecta todo el HTML del dashboard a partir de los datos de la API.
         */
        function renderizarDashboard(ciudad, pais, datosAPI) {
            const c = datosAPI.current;
            const condicion = resolverCodigo(c.weather_code);

            // Interpreta el índice UV en una escala semántica
            const uv = c.uv_index ?? 0;
            const nivelUV = uv <= 2 ? 'Bajo'
                          : uv <= 5 ? 'Moderado'
                          : uv <= 7 ? 'Alto'
                          : uv <= 10 ? 'Muy alto'
                          : 'Extremo';

            // Construye las 5 tarjetas de pronóstico
            const pronosticoHTML = datosAPI.daily.time.map((fecha, i) => {
                const cod = resolverCodigo(datosAPI.daily.weather_code[i]);
                return `
                    <div class="forecast-card">
                        <div class="forecast-day">${i === 0 ? 'Hoy' : diaCorto(fecha)}</div>
                        <div class="forecast-emoji">${cod.emoji}</div>
                        <div class="forecast-temp-max">${Math.round(datosAPI.daily.temperature_2m_max[i])}°</div>
                        <div class="forecast-temp-min">${Math.round(datosAPI.daily.temperature_2m_min[i])}°</div>
                    </div>`;
            }).join('');

            dashboardBody.innerHTML = `
                <div class="main-content">

                    <!-- ── Columna izquierda: Clima Actual ── -->
                    <div class="current-weather">
                        <div class="city-name">${ciudad}${pais ? ', ' + pais : ''}</div>
                        <div class="current-date">${formatearFechaLarga(datosAPI.daily.time[0])}</div>
                        <div class="weather-emoji">${condicion.emoji}</div>
                        <div class="temperature-main">${Math.round(c.temperature_2m)}°C</div>
                        <div class="weather-description">${condicion.texto}</div>
                    </div>

                    <!-- ── Columna derecha: Detalles 2×2 ── -->
                    <div class="details-grid">
                        <div class="detail-card">
                            <div class="detail-label">Humedad</div>
                            <div class="detail-icon">💧</div>
                            <div class="detail-value">${c.relative_humidity_2m}%</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-label">Sensación térmica</div>
                            <div class="detail-icon">🌡️</div>
                            <div class="detail-value">${Math.round(c.apparent_temperature)}°C</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-label">Viento</div>
                            <div class="detail-icon">💨</div>
                            <div class="detail-value">${Math.round(c.wind_speed_10m)} <span class="detail-sub">km/h</span></div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-label">Índice UV</div>
                            <div class="detail-icon">🔆</div>
                            <div class="detail-value">${uv.toFixed(1)} <span class="detail-sub">${nivelUV}</span></div>
                        </div>
                    </div>
                </div>

                <!-- ── Pronóstico de 5 días ── -->
                <div class="forecast-section">
                    <div class="forecast-title">Pronóstico 5 días</div>
                    <div class="forecast-row">${pronosticoHTML}</div>
                </div>`;
        }

        // ============================================================
        //  FLUJOS DE BÚSQUEDA
        // ============================================================

        /** Busca por nombre de ciudad y renderiza el resultado. */
        async function buscarCiudad(nombreCiudad) {
            mostrarCargando(`Buscando "${nombreCiudad}"…`);
            try {
                const { ubicacion, datos } = await obtenerClima(nombreCiudad);
                renderizarDashboard(ubicacion.ciudad, ubicacion.pais, datos);
                // Refleja la ciudad resuelta en formato "Ciudad, País" para que el usuario
                // vea exactamente qué lugar encontró la API (ej: "Hawaii, Guatemala" vs "Hawaii, Estados Unidos").
                const etiqueta = ubicacion.pais
                    ? `${ubicacion.ciudad}, ${ubicacion.pais}`
                    : ubicacion.ciudad;
                document.getElementById('search-input').value = etiqueta;
            } catch (err) {
                console.error('[buscarCiudad]', err);
                mostrarError(err.message);
            }
        }

        /** Busca por coordenadas GPS (para el botón de mira). */
        async function buscarPorCoordenadas(lat, lon) {
            mostrarCargando('Obteniendo clima por GPS…');
            try {
                const nombreCiudad = await ciudadDesdeCoordenadas(lat, lon);
                const datos = await obtenerClimaPorCoordenadas(lat, lon);
                renderizarDashboard(nombreCiudad, '', datos);
                document.getElementById('search-input').value = nombreCiudad;
            } catch (err) {
                console.error('[buscarPorCoordenadas]', err);
                mostrarError('No se pudo obtener el clima por GPS: ' + err.message);
            }
        }

        // ============================================================
        //  INTERACTIVIDAD: Búsqueda + Botón GPS
        // ============================================================
        const searchInput = document.getElementById('search-input');
        const btnGPS      = document.getElementById('btn-gps');

        // Enter en barra de búsqueda ejecuta el flujo completo
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (query) buscarCiudad(query);
            }
        });

        // Botón GPS: solicita permiso SOLO ante acción voluntaria del usuario
        btnGPS.addEventListener('click', () => {
            if (!navigator.geolocation) {
                mostrarError('Tu navegador no soporta geolocalización.');
                return;
            }
            mostrarCargando('Solicitando permiso de ubicación…');
            navigator.geolocation.getCurrentPosition(
                (pos) => buscarPorCoordenadas(pos.coords.latitude, pos.coords.longitude),
                ()    => mostrarError('Permiso de ubicación denegado o tiempo de espera agotado.'),
                { timeout: 10000 }
            );
        });

        // ============================================================
        //  CARGA INICIAL INTELIGENTE
        //  1. Intenta detectar ciudad por IP (silencioso, sin permisos)
        //  2. Si falla/tarda, cae en "Santiago de Cali" como respaldo
        // ============================================================
        async function inicializar() {
            const CIUDAD_FALLBACK = 'Santiago de Cali';

            try {
                // Timeout de 4 s para que un adblocker no congele la carga
                const ctrl  = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 4000);
                const res   = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
                clearTimeout(timer);

                if (!res.ok) throw new Error('ipapi no disponible');
                const ipData = await res.json();

                // Usa la ciudad detectada por IP, o el fallback si viene vacía
                await buscarCiudad(ipData.city || CIUDAD_FALLBACK);

            } catch {
                // La API de IP fue bloqueada, tardó mucho o lanzó error: fallback inmediato
                await buscarCiudad(CIUDAD_FALLBACK);
            }
        }

        inicializar();
    </script>

</body>
