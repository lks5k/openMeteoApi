<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard del Clima</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Capa de fondo: imagen de ciudad o gradiente meteorológico -->
    <div id="fondo-ciudad"></div>

    <div class="dashboard">

        <!-- Fila superior: búsqueda + botón GPS -->
        <div class="search-row">
            <div class="search-wrapper">
                <input
                    type="text"
                    id="search-input"
                    class="search-input"
                    placeholder="Buscar ciudad…"
                    autocomplete="off"
                    spellcheck="false"
                    role="combobox"
                    aria-autocomplete="list"
                    aria-expanded="false"
                    aria-haspopup="listbox"
                />
                <!-- El dropdown se inyecta aquí dinámicamente -->
            </div>
            <button id="btn-gps" class="btn-location" title="Usar ubicación actual por GPS">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="3"/>
                    <circle cx="12" cy="12" r="9"/>
                    <line x1="12" y1="2"  x2="12" y2="6"/>
                    <line x1="12" y1="18" x2="12" y2="22"/>
                    <line x1="2"  y1="12" x2="6"  y2="12"/>
                    <line x1="18" y1="12" x2="22" y2="12"/>
                </svg>
                <span>Usar ubicación actual</span>
            </button>
            <button id="btn-agregar-comparar" class="btn-agregar-comparar"
                    title="Busca una ciudad primero" disabled aria-label="Añadir ciudad actual al comparador">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8"  y1="12" x2="16" y2="12"/>
                </svg>
                <span>+ Comparar</span>
            </button>
            <button id="btn-tema" class="btn-tema" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro/oscuro">
                <span id="tema-icon">🌙</span>
            </button>
            <button id="btn-comparar" class="btn-comparar-toggle" title="Comparar varias ciudades" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="3" width="7" height="7" rx="1"/>
                    <rect x="14" y="14" width="7" height="7" rx="1"/>
                    <rect x="3" y="14" width="7" height="7" rx="1"/>
                </svg>
                <span>Comparar</span>
            </button>
        </div>

        <!-- Panel de comparación multi-ciudad (oculto por defecto) -->
        <div id="comparar-panel" class="comparar-panel" hidden>
            <div class="comparar-barra">
                <div class="comparar-input-wrapper">
                    <input
                        type="text"
                        id="comparar-input"
                        class="comparar-input"
                        placeholder="Ciudad (ej: París, Francia)…"
                        autocomplete="off"
                        spellcheck="false"
                    />
                    <button id="btn-agregar-ciudad" class="btn-agregar">Añadir</button>
                </div>
                <button id="btn-ejecutar-comparar" class="btn-ejecutar-comparar" disabled>
                    Ver comparativa
                </button>
            </div>
            <div id="comparar-chips" class="comparar-chips"></div>
            <div id="comparar-resultado"></div>
        </div>

        <!-- Cuerpo del dashboard (se inyecta dinámicamente) -->
        <div id="dashboard-body">
            <div class="loading-overlay">Detectando tu ubicación…</div>
        </div>

    </div>

    <!-- Barra inferior: caption de la imagen + controles del carrusel -->
    <div id="fondo-caption" class="fondo-caption" hidden>
        <div class="fondo-caption-inner">
            <div class="fondo-caption-texto">
                <span id="caption-titulo"      class="caption-titulo"></span>
                <span id="caption-ubicacion"   class="caption-ubicacion"></span>
                <p    id="caption-descripcion" class="caption-descripcion"></p>
            </div>
            <div class="fondo-caption-controles">
                <button id="btn-fondo-prev" class="btn-fondo-nav" aria-label="Imagen anterior">&#8249;</button>
                <span   id="caption-contador"  class="caption-contador"></span>
                <button id="btn-fondo-next" class="btn-fondo-nav" aria-label="Siguiente imagen">&#8250;</button>
            </div>
        </div>
    </div>

    <script>
        // Dashboard del Clima — Open-Meteo + Wikipedia + Nominatim
        // Lógica equivalente probada en lib/ (npm test). Ver README y modeloDatos.md.
        // ============================================================
        //  DICCIONARIO WMO — Códigos de clima a texto ES + emoji
        //  Referencia: https://open-meteo.com/en/docs#weathervariables
        // ============================================================
        const WMO_CODES = {
            0:  { texto: 'Cielo despejado',           emoji: '☀️'  },
            1:  { texto: 'Mayormente despejado',       emoji: '🌤️' },
            2:  { texto: 'Parcialmente nublado',       emoji: '⛅'  },
            3:  { texto: 'Cubierto',                   emoji: '☁️'  },
            45: { texto: 'Niebla',                     emoji: '🌫️' },
            48: { texto: 'Niebla con escarcha',        emoji: '🌫️' },
            51: { texto: 'Llovizna ligera',            emoji: '🌦️' },
            53: { texto: 'Llovizna moderada',          emoji: '🌦️' },
            55: { texto: 'Llovizna intensa',           emoji: '🌧️' },
            56: { texto: 'Llovizna helada ligera',     emoji: '🌧️' },
            57: { texto: 'Llovizna helada densa',      emoji: '🌧️' },
            61: { texto: 'Lluvia ligera',              emoji: '🌧️' },
            63: { texto: 'Lluvia moderada',            emoji: '🌧️' },
            65: { texto: 'Lluvia intensa',             emoji: '🌧️' },
            66: { texto: 'Lluvia helada ligera',       emoji: '🌨️' },
            67: { texto: 'Lluvia helada intensa',      emoji: '🌨️' },
            71: { texto: 'Nevada ligera',              emoji: '❄️'  },
            73: { texto: 'Nevada moderada',            emoji: '❄️'  },
            75: { texto: 'Nevada intensa',             emoji: '❄️'  },
            77: { texto: 'Granizo fino',               emoji: '🌨️' },
            80: { texto: 'Chubascos ligeros',          emoji: '🌦️' },
            81: { texto: 'Chubascos moderados',        emoji: '🌧️' },
            82: { texto: 'Chubascos muy intensos',     emoji: '⛈️'  },
            85: { texto: 'Nieve en chubascos',         emoji: '❄️'  },
            86: { texto: 'Nieve intensa en chubascos', emoji: '❄️'  },
            95: { texto: 'Tormenta eléctrica',         emoji: '⛈️'  },
            96: { texto: 'Tormenta con granizo',       emoji: '⛈️'  },
            99: { texto: 'Tormenta severa con granizo',emoji: '⛈️'  },
        };

        /**
         * Resuelve un código meteorológico WMO a su descripción textual y emoji correspondiente.
         * Si el código no existe en el diccionario, devuelve un objeto genérico de fallback.
         *
         * @param {number} codigo - Código numérico WMO del estado del tiempo
         *   (ej. `0` = cielo despejado, `95` = tormenta eléctrica).
         * @returns {{ texto: string, emoji: string }} Objeto con la descripción en español
         *   y el emoji representativo del estado meteorológico.
         *
         * @example
         * resolverCodigo(0);   // { texto: 'Cielo despejado', emoji: '☀️' }
         * resolverCodigo(95);  // { texto: 'Tormenta eléctrica', emoji: '⛈️' }
         * resolverCodigo(999); // { texto: 'Estado 999', emoji: '🌡️' }
         */
        function resolverCodigo(codigo) {
            return WMO_CODES[codigo] ?? { texto: `Estado ${codigo}`, emoji: '🌡️' };
        }

        // ============================================================
        //  UTILIDADES DE FECHA
        // ============================================================
        const DIAS        = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
        const DIAS_CORTOS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        const MESES       = ['enero','febrero','marzo','abril','mayo','junio',
                             'julio','agosto','septiembre','octubre','noviembre','diciembre'];

        /**
         * Formatea una fecha en formato ISO (YYYY-MM-DD) a una cadena legible en español.
         * Fija la hora a mediodía UTC (`T12:00:00Z`) para evitar desfases de zona horaria
         * que podrían desplazar el día mostrado.
         *
         * @param {string} fechaISO - Fecha en formato ISO 8601, ej. `'2026-05-22'`.
         * @returns {string} Fecha formateada con día de semana completo, día numérico,
         *   mes en texto y año, ej. `'Viernes, 22 de mayo de 2026'`.
         *
         * @example
         * formatearFechaLarga('2026-05-22'); // 'Viernes, 22 de mayo de 2026'
         * formatearFechaLarga('2026-01-01'); // 'Jueves, 1 de enero de 2026'
         */
        function formatearFechaLarga(fechaISO) {
            const d = new Date(fechaISO + 'T12:00:00Z');
            return `${DIAS[d.getUTCDay()]}, ${d.getUTCDate()} de ${MESES[d.getUTCMonth()]} de ${d.getUTCFullYear()}`;
        }

        /**
         * Extrae el nombre abreviado del día de la semana a partir de una fecha ISO.
         * Usado en las tarjetas del pronóstico de 5 días.
         *
         * @param {string} fechaISO - Fecha en formato ISO 8601, ej. `'2026-05-22'`.
         * @returns {string} Abreviatura de 3 letras del día en español,
         *   ej. `'Vie'`, `'Lun'`, `'Dom'`.
         *
         * @example
         * diaCorto('2026-05-22'); // 'Vie'
         * diaCorto('2026-05-25'); // 'Lun'
         */
        function diaCorto(fechaISO) {
            const d = new Date(fechaISO + 'T12:00:00Z');
            return DIAS_CORTOS[d.getUTCDay()];
        }

        // ============================================================
        //  ESTADO GLOBAL
        // ============================================================

        /** Última ubicación consultada exitosamente; permite al botón refresh reusar coords. */
        let ultimaConsulta = null;

        // ============================================================
        //  CACHÉ DE CLIMA — TTL de 1 hora en localStorage
        //  Compatible con cualquier navegador moderno (multiplataforma):
        //  usa localStorage estándar con serialización JSON.
        // ============================================================

        /** Tiempo de vida de cada entrada de caché: 1 hora en milisegundos. */
        const CACHE_TTL_MS  = 3_600_000;
        /** Prefijo de namespace para las claves de caché en localStorage. */
        const CACHE_PREFIJO = 'wc-';

        /**
         * Genera la clave de localStorage para un par de coordenadas.
         * Redondea a 2 decimales (~1.1 km de precisión) para agrupar consultas
         * de puntos prácticamente idénticos dentro de la misma ciudad.
         *
         * @param {number} latitud
         * @param {number} longitud
         * @returns {string}
         */
        function claveCache(latitud, longitud) {
            return `${CACHE_PREFIJO}${latitud.toFixed(2)}_${longitud.toFixed(2)}`;
        }

        /**
         * Intenta leer una entrada de caché válida para las coordenadas dadas.
         * Devuelve los datos del clima si existen y no han expirado (< 1 hora).
         * Elimina automáticamente las entradas vencidas para no acumular datos
         * obsoletos en el almacenamiento.
         *
         * @param {number} latitud
         * @param {number} longitud
         * @returns {object|null} Respuesta JSON de la API, o null si no hay caché válida.
         */
        function leerCache(latitud, longitud) {
            try {
                const clave = claveCache(latitud, longitud);
                const raw   = localStorage.getItem(clave);
                if (!raw) return null;
                const { timestamp, datos } = JSON.parse(raw);
                if (Date.now() - timestamp > CACHE_TTL_MS) {
                    localStorage.removeItem(clave);
                    return null;
                }
                return datos;
            } catch {
                return null;
            }
        }

        /**
         * Persiste los datos del clima en localStorage junto con la marca de tiempo
         * de escritura. Falla de forma silenciosa si el almacenamiento está lleno
         * o deshabilitado (ej. modo privado con cuota reducida) para no interrumpir
         * el flujo principal de la aplicación.
         *
         * @param {number} latitud
         * @param {number} longitud
         * @param {object} datos - Respuesta JSON completa de Open-Meteo.
         */
        function escribirCache(latitud, longitud, datos) {
            try {
                localStorage.setItem(
                    claveCache(latitud, longitud),
                    JSON.stringify({ timestamp: Date.now(), datos })
                );
            } catch {
                // localStorage puede estar lleno o deshabilitado; se ignora sin romper la app.
            }
        }

        /**
         * Elimina la entrada de caché de unas coordenadas específicas,
         * forzando que la próxima consulta haga un fetch fresco a la API.
         *
         * @param {number} latitud
         * @param {number} longitud
         */
        function invalidarCache(latitud, longitud) {
            localStorage.removeItem(claveCache(latitud, longitud));
        }

        // ============================================================
        //  HELPERS DE VIENTO, FONDO DINÁMICO, TEMA E HISTORIAL
        // ============================================================

        /**
         * Convierte grados de dirección del viento (0-360) al punto cardinal más cercano,
         * usando una rosa de 8 direcciones con intervalos de 45°.
         *
         * @param {number} grados - Ángulo de procedencia del viento en grados (0 = Norte).
         * @returns {string} Abreviatura del punto cardinal en español: N, NE, E, SE, S, SO, O, NO.
         *
         * @example
         * gradosACardinal(0);   // 'N'
         * gradosACardinal(90);  // 'E'
         * gradosACardinal(225); // 'SO'
         */
        function gradosACardinal(grados) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
            return dirs[Math.round(grados / 45) % 8];
        }

        /**
         * Asigna al `<body>` una clase CSS de fondo dinámico según el código WMO del clima actual.
         * Elimina cualquier clase previa `wx-*` antes de aplicar la nueva, garantizando
         * un estado limpio en cada actualización del dashboard.
         * En tema oscuro el fondo no cambia (la clase queda en el DOM pero no aplica estilos,
         * ya que el selector CSS usa `html:not([data-tema="dark"])`).
         *
         * @param {number} weatherCode - Código WMO del estado meteorológico actual.
         * @returns {void}
         *
         * @example
         * aplicarFondoDinamico(0);  // body.wx-sunny  → gradiente amarillo-azul
         * aplicarFondoDinamico(63); // body.wx-rainy  → gradiente azul
         * aplicarFondoDinamico(95); // body.wx-stormy → gradiente violeta
         */
        function aplicarFondoDinamico(weatherCode) {
            // Las clases wx-* se aplican a #fondo-ciudad (no al body)
            // para que coexistan con el sistema de imagen de ciudad.
            const fondoEl = document.getElementById('fondo-ciudad');
            if (!fondoEl) return;
            const clases = ['wx-sunny', 'wx-cloudy', 'wx-rainy', 'wx-snowy', 'wx-stormy', 'wx-foggy'];
            fondoEl.classList.remove(...clases);

            let clase;
            if (weatherCode <= 1)                                               clase = 'wx-sunny';
            else if (weatherCode <= 3)                                          clase = 'wx-cloudy';
            else if (weatherCode <= 48)                                         clase = 'wx-foggy';
            else if (weatherCode <= 67 || (weatherCode >= 80 && weatherCode <= 82)) clase = 'wx-rainy';
            else if ((weatherCode >= 71 && weatherCode <= 77) ||
                     weatherCode === 85 || weatherCode === 86)                  clase = 'wx-snowy';
            else                                                                clase = 'wx-stormy';

            fondoEl.classList.add(clase);
        }

        /**
         * Aplica el tema (claro u oscuro) al elemento raíz `<html>`, actualiza el icono
         * del botón de alternancia y persiste la elección en `localStorage`.
         *
         * @param {'light'|'dark'} tema - Identificador del tema a aplicar.
         * @returns {void}
         */
        function aplicarTema(tema) {
            document.documentElement.dataset.tema = tema;
            const icono = document.getElementById('tema-icon');
            if (icono) icono.textContent = tema === 'dark' ? '☀️' : '🌙';
            localStorage.setItem('tema', tema);
        }

        /**
         * Inicializa el tema al cargar la página consultando, en orden de prioridad:
         * 1. La preferencia guardada en `localStorage`.
         * 2. La preferencia del sistema operativo (`prefers-color-scheme`).
         * 3. Tema claro como valor por defecto.
         *
         * @returns {void}
         */
        function inicializarTema() {
            const guardado     = localStorage.getItem('tema');
            const preferOscuro = window.matchMedia('(prefers-color-scheme: dark)').matches;
            aplicarTema(guardado ?? (preferOscuro ? 'dark' : 'light'));
        }

        /**
         * Guarda una ciudad en el historial de búsquedas almacenado en `localStorage`.
         * La entrada se inserta al inicio, se deduplica (elimina entradas previas iguales)
         * y el historial se recorta a un máximo de 5 elementos.
         *
         * @param {string} ciudad - Nombre de la ciudad buscada.
         * @param {string} pais   - Nombre del país (cadena vacía si no aplica).
         * @returns {void}
         */
        function guardarEnHistorial(ciudad, pais) {
            const etiqueta = pais ? `${ciudad}, ${pais}` : ciudad;
            const historial = obtenerHistorial().filter(e => e !== etiqueta);
            historial.unshift(etiqueta);
            localStorage.setItem('historial-ciudades', JSON.stringify(historial.slice(0, 5)));
        }

        /**
         * Lee y devuelve el historial de búsquedas desde `localStorage`.
         * Si la entrada no existe o contiene JSON inválido, devuelve un arreglo vacío
         * sin propagar el error.
         *
         * @returns {string[]} Arreglo de etiquetas de ciudades en formato `"Ciudad, País"`
         *   o solo `"Ciudad"` si no tiene país, ordenado de más reciente a más antiguo.
         */
        function obtenerHistorial() {
            try {
                return JSON.parse(localStorage.getItem('historial-ciudades') ?? '[]');
            } catch {
                return [];
            }
        }

        /**
         * Construye e inserta en el DOM un dropdown con el historial de búsquedas recientes.
         * Si el historial está vacío, no inserta nada. Cada ítem del historial muestra
         * un ícono de reloj y la etiqueta de la ciudad. Al hacer clic, invoca `buscarCiudad`.
         * Usa `mousedown` en lugar de `click` para evitar la interferencia con el evento
         * `blur` del input de búsqueda.
         *
         * @returns {void}
         */
        function renderizarHistorial() {
            const historial = obtenerHistorial();
            if (!historial.length) return;

            cerrarSugerencias();
            searchInput.setAttribute('aria-expanded', 'true');

            const lista = document.createElement('ul');
            lista.className = 'suggestions-list';
            lista.setAttribute('role', 'listbox');

            const header = document.createElement('li');
            header.className = 'dropdown-section-label';
            header.textContent = 'Búsquedas recientes';
            header.setAttribute('role', 'presentation');
            lista.appendChild(header);

            historial.forEach(etiqueta => {
                const li = document.createElement('li');
                li.className = 'suggestion-item';
                li.setAttribute('role', 'option');
                li.innerHTML = `
                    <span class="sug-icon">🕐</span>
                    <span class="sug-city">${etiqueta}</span>`;
                li.addEventListener('mousedown', e => {
                    e.preventDefault();
                    buscarCiudad(etiqueta);
                });
                lista.appendChild(li);
            });

            searchWrapper.appendChild(lista);
        }

        /**
         * Repite la última consulta meteorológica exitosa usando las coordenadas almacenadas
         * en `ultimaConsulta`. Anima el botón de refresco durante la petición.
         * No hace nada si no hay ninguna consulta previa registrada.
         *
         * @async
         * @returns {Promise<void>}
         */
        async function refrescar() {
            if (!ultimaConsulta) return;
            const btnRefresh = document.querySelector('.btn-refresh');
            if (btnRefresh) btnRefresh.classList.add('spin');
            // El botón ↻ siempre debe mostrar datos frescos: invalida la caché antes del fetch.
            invalidarCache(ultimaConsulta.latitud, ultimaConsulta.longitud);
            try {
                const datos = await obtenerClimaPorCoordenadas(ultimaConsulta.latitud, ultimaConsulta.longitud);
                renderizarDashboard(ultimaConsulta.ciudad, ultimaConsulta.pais, datos);
            } catch (err) {
                mostrarError(err.message);
            }
        }

        // ============================================================
        //  CAPA DE DATOS
        // ============================================================

        /**
         * Divide una consulta de búsqueda en su término principal (nombre de ciudad)
         * y un hint de país opcional, separados por coma.
         *
         * @param {string} consulta - Texto de búsqueda, ej. `'Madrid, España'` o `'Londres'`.
         * @returns {{ termino: string, paisHint: string|null }} Objeto con el término de ciudad
         *   limpio y el hint de país (`null` si no se proporcionó).
         *
         * @example
         * parsearConsulta('Madrid, España'); // { termino: 'Madrid', paisHint: 'España' }
         * parsearConsulta('Londres');        // { termino: 'Londres', paisHint: null }
         */
        function parsearConsulta(consulta) {
            const partes = consulta.split(',').map(p => p.trim());
            return { termino: partes[0], paisHint: partes[1] ?? null };
        }

        /**
         * Normaliza una cadena de texto para comparaciones uniformes:
         * convierte a minúsculas, elimina tildes y diacríticos mediante
         * descomposición Unicode (NFD), y descarta caracteres no alfanuméricos.
         *
         * @param {string} str - Cadena de texto a normalizar.
         * @returns {string} Cadena en minúsculas sin acentos ni caracteres especiales.
         *
         * @example
         * normalizar('España');    // 'espana'
         * normalizar('São Paulo'); // 'sao paulo'
         * normalizar('Côte d\'Ivoire'); // 'cote divoire'
         */
        function normalizar(str) {
            return str.toLowerCase()
                      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                      .replace(/[^a-z0-9\s]/g, '')
                      .trim();
        }

        const PAIS_ALIAS = {
            'us': 'US', 'usa': 'US', 'eeuu': 'US', 'estados unidos': 'US', 'united states': 'US',
            'gb': 'GB', 'uk': 'GB', 'reino unido': 'GB', 'united kingdom': 'GB', 'england': 'GB',
            'mx': 'MX', 'mexico': 'MX',
            'co': 'CO', 'colombia': 'CO',
            'ar': 'AR', 'argentina': 'AR',
            'cl': 'CL', 'chile': 'CL',
            'pe': 'PE', 'peru': 'PE',
            've': 'VE', 'venezuela': 'VE',
            'ec': 'EC', 'ecuador': 'EC',
            'bo': 'BO', 'bolivia': 'BO',
            'py': 'PY', 'paraguay': 'PY',
            'uy': 'UY', 'uruguay': 'UY',
            'gt': 'GT', 'guatemala': 'GT',
            'es': 'ES', 'espana': 'ES', 'spain': 'ES',
            'fr': 'FR', 'france': 'FR', 'francia': 'FR',
            'de': 'DE', 'germany': 'DE', 'alemania': 'DE',
            'it': 'IT', 'italy': 'IT', 'italia': 'IT',
            'pt': 'PT', 'portugal': 'PT',
            'br': 'BR', 'brazil': 'BR', 'brasil': 'BR',
            'ca': 'CA', 'canada': 'CA',
            'au': 'AU', 'australia': 'AU',
            'jp': 'JP', 'japan': 'JP', 'japon': 'JP',
            'cn': 'CN', 'china': 'CN',
            'in': 'IN', 'india': 'IN',
            'ru': 'RU', 'russia': 'RU', 'rusia': 'RU',
        };

        /**
         * Convierte un hint de país (nombre completo, alias coloquial o código ISO 2)
         * al código ISO 3166-1 alpha-2 en mayúsculas. Si recibe exactamente dos letras,
         * las interpreta directamente como código ISO. Si no reconoce el hint, devuelve `null`.
         *
         * @param {string|null} hint - Nombre o código del país, ej. `'España'`, `'es'`, `'eeuu'`.
         * @returns {string|null} Código ISO 3166-1 alpha-2, ej. `'ES'`, `'US'`.
         *   `null` si el hint es nulo o no está en el diccionario `PAIS_ALIAS`.
         *
         * @example
         * resolverCodigoPais('eeuu');    // 'US'
         * resolverCodigoPais('España');  // 'ES'
         * resolverCodigoPais('es');      // 'ES'
         * resolverCodigoPais(null);      // null
         */
        function resolverCodigoPais(hint) {
            if (!hint) return null;
            const norm = normalizar(hint);
            if (/^[a-z]{2}$/.test(norm)) return norm.toUpperCase();
            return PAIS_ALIAS[norm] ?? null;
        }

        /**
         * Consulta la API de geocodificación de Open-Meteo y devuelve hasta `count` candidatos
         * crudos, ordenados por población descendente. Si se detecta un hint de país en la
         * consulta, filtra los resultados por ese país antes de ordenar. Usado tanto por
         * `geocodificarCiudad` como por el autocompletado del input de búsqueda.
         *
         * @async
         * @param {string} consulta - Nombre de ciudad con hint de país opcional,
         *   ej. `'Valencia, España'` o `'Springfield, US'`.
         * @param {number} [count=5] - Número máximo de resultados a solicitar a la API.
         * @returns {Promise<Array<object>>} Arreglo de objetos candidatos crudos de la API
         *   (puede ser vacío si no hay resultados). Cada objeto incluye `name`, `latitude`,
         *   `longitude`, `country`, `country_code`, `admin1` y `population`.
         * @throws {Error} Si la petición HTTP a la API de geocodificación falla (status no 2xx).
         *
         * @example
         * const candidatos = await buscarCandidatos('Bogotá, Colombia', 3);
         * // [{ name: 'Bogotá', latitude: 4.71, longitude: -74.07, country: 'Colombia', ... }]
         */
        async function buscarCandidatos(consulta, count = 5) {
            const { termino, paisHint } = parsearConsulta(consulta);
            const codigoPais = resolverCodigoPais(paisHint);

            const url = `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(termino)}&count=${count}&language=es&format=json`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`Error de geocodificación: ${res.status}`);
            const datos = await res.json();
            if (!datos.results?.length) return [];

            let candidatos = datos.results;

            if (codigoPais) {
                const filtrados = candidatos.filter(r => r.country_code === codigoPais);
                if (filtrados.length > 0) candidatos = filtrados;
            }

            candidatos.sort((a, b) => (b.population ?? 0) - (a.population ?? 0));
            return candidatos;
        }

        /**
         * Geocodifica una consulta de ciudad usando la API de Open-Meteo y devuelve
         * el candidato con mayor población como resultado principal.
         *
         * @async
         * @param {string} consulta - Nombre de ciudad con hint de país opcional,
         *   ej. `'Lima, Perú'` o `'París'`.
         * @returns {Promise<{ ciudad: string, pais: string, latitud: number, longitud: number }>}
         *   Objeto con el nombre normalizado de la ciudad, su país y coordenadas geográficas.
         * @throws {Error} Si ningún resultado es encontrado para la consulta proporcionada.
         *
         * @example
         * const loc = await geocodificarCiudad('Buenos Aires');
         * // { ciudad: 'Buenos Aires', pais: 'Argentina', latitud: -34.61, longitud: -58.37 }
         */
        async function geocodificarCiudad(consulta) {
            const candidatos = await buscarCandidatos(consulta, 5);
            if (!candidatos.length) {
                const { termino } = parsearConsulta(consulta);
                throw new Error(`No se encontró la ciudad "${termino}".`);
            }
            const mejor = candidatos[0];
            return {
                ciudad:   mejor.name,
                pais:     mejor.country ?? '',
                latitud:  mejor.latitude,
                longitud: mejor.longitude,
            };
        }

        /**
         * Obtiene el clima actual y el pronóstico de 5 días para unas coordenadas geográficas
         * usando la API de Open-Meteo. Solicita: temperatura, código meteorológico, humedad
         * relativa, sensación térmica, velocidad del viento, dirección del viento e índice UV
         * para el momento actual; y código, temperatura máxima/mínima y probabilidad máxima
         * de precipitación diarias para el pronóstico.
         *
         * @async
         * @param {number} latitud - Latitud geográfica del punto de consulta, ej. `4.71`.
         * @param {number} longitud - Longitud geográfica del punto de consulta, ej. `-74.07`.
         * @returns {Promise<object>} Respuesta JSON de la API con las propiedades
         *   `current` (datos actuales) y `daily` (pronóstico diario).
         *   `current` incluye: `temperature_2m`, `weather_code`, `relative_humidity_2m`,
         *   `apparent_temperature`, `wind_speed_10m`, `wind_direction_10m`, `uv_index`.
         *   `daily` incluye: `time`, `weather_code`, `temperature_2m_max`,
         *   `temperature_2m_min`, `precipitation_probability_max`.
         * @throws {Error} Si la petición HTTP a la API de predicción meteorológica falla (status no 2xx).
         *
         * @example
         * const datos = await obtenerClimaPorCoordenadas(4.71, -74.07);
         * // { current: { temperature_2m: 18, weather_code: 3, wind_direction_10m: 270, uv_index: 4, ... },
         * //   daily:   { time: ['2026-05-22', ...], precipitation_probability_max: [30, ...], ... } }
         */
        async function obtenerClimaPorCoordenadas(latitud, longitud) {
            const cached = leerCache(latitud, longitud);
            if (cached) return cached;

            const params = new URLSearchParams({
                latitude:      latitud,
                longitude:     longitud,
                current:       'temperature_2m,weather_code,relative_humidity_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,uv_index',
                daily:         'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
                forecast_days: 5,
                timezone:      'auto',
            });
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
            if (!res.ok) throw new Error(`Error al obtener el clima: ${res.status}`);
            const datos = await res.json();
            escribirCache(latitud, longitud, datos);
            return datos;
        }

        /**
         * Función de alto nivel que combina geocodificación y obtención del pronóstico.
         * Primero resuelve el nombre de ciudad a coordenadas y luego consulta el clima,
         * devolviendo ambos resultados en un único objeto.
         *
         * @async
         * @param {string} nombreCiudad - Nombre de ciudad con hint de país opcional,
         *   ej. `'Medellín'` o `'Cartagena, Colombia'`.
         * @returns {Promise<{ ubicacion: { ciudad: string, pais: string, latitud: number, longitud: number }, datos: object }>}
         *   Objeto con `ubicacion` (datos geocodificados) y `datos` (respuesta JSON de la API del clima).
         * @throws {Error} Si la geocodificación falla o la petición del clima retorna un error.
         *
         * @example
         * const { ubicacion, datos } = await obtenerClima('Cartagena, Colombia');
         * // ubicacion: { ciudad: 'Cartagena', pais: 'Colombia', latitud: 10.39, longitud: -75.48 }
         * // datos:     { current: { temperature_2m: 32, ... }, daily: { ... } }
         */
        async function obtenerClima(nombreCiudad) {
            const ubicacion = await geocodificarCiudad(nombreCiudad);
            const datos     = await obtenerClimaPorCoordenadas(ubicacion.latitud, ubicacion.longitud);
            return { ubicacion, datos };
        }

        /**
         * Realiza geocodificación inversa usando la API de Nominatim (OpenStreetMap)
         * para obtener el nombre de ciudad a partir de coordenadas GPS.
         * Recorre los campos de dirección en orden de granularidad descendente:
         * `city` → `town` → `village` → `municipality`. Si ninguno está disponible,
         * devuelve `'Tu ubicación'` como fallback seguro.
         *
         * @async
         * @param {number} lat - Latitud geográfica obtenida del GPS del dispositivo.
         * @param {number} lon - Longitud geográfica obtenida del GPS del dispositivo.
         * @returns {Promise<string>} Nombre de la localidad más cercana a las coordenadas,
         *   o `'Tu ubicación'` si Nominatim no devuelve ningún campo de ciudad.
         * @throws {Error} Si la petición HTTP a Nominatim falla (status no 2xx).
         *
         * @example
         * const ciudad = await ciudadDesdeCoordenadas(4.71, -74.07);
         * // 'Bogotá'
         */
        async function ciudadDesdeCoordenadas(lat, lon) {
            const url = `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=es`;
            const res = await fetch(url, { headers: { 'Accept-Language': 'es' } });
            if (!res.ok) throw new Error('Geocodificación inversa fallida');
            const d = await res.json();
            return d.address?.city
                || d.address?.town
                || d.address?.village
                || d.address?.municipality
                || 'Tu ubicación';
        }

        // ============================================================
        //  CAPA DE RENDERIZADO
        // ============================================================
        const dashboardBody = document.getElementById('dashboard-body');

        /**
         * Reemplaza el contenido del panel `#dashboard-body` con un overlay de carga
         * y un mensaje informativo para el usuario mientras se realiza una petición asíncrona.
         *
         * @param {string} [msg='Cargando datos del clima…'] - Texto a mostrar durante la carga.
         * @returns {void}
         *
         * @example
         * mostrarCargando();                     // Mensaje por defecto
         * mostrarCargando('Buscando "París"…');  // Mensaje personalizado
         */
        function mostrarCargando(msg = 'Cargando datos del clima…') {
            dashboardBody.innerHTML = `<div class="loading-overlay">${msg}</div>`;
        }

        /**
         * Reemplaza el contenido del panel `#dashboard-body` con un mensaje de error
         * visible y estilizado para el usuario.
         *
         * @param {string} msg - Descripción del error a mostrar, ej. `'No se encontró la ciudad "Xyz".'`.
         * @returns {void}
         *
         * @example
         * mostrarError('No se encontró la ciudad "Xyz".');
         * mostrarError('Permiso de ubicación denegado.');
         */
        function mostrarError(msg) {
            dashboardBody.innerHTML = `<p class="error-msg">⚠️ ${msg}</p>`;
        }

        /**
         * Genera e inyecta el HTML completo del dashboard meteorológico en `#dashboard-body`.
         * Renderiza dos secciones: (1) clima actual con temperatura, condición, humedad,
         * sensación térmica, viento con dirección cardinal, índice UV y la hora de última
         * actualización con un botón de refresco; (2) pronóstico de 5 días con tarjetas
         * individuales que incluyen emoji, temperaturas y probabilidad de precipitación.
         * También aplica el fondo dinámico al `<body>` según el código WMO actual.
         *
         * @param {string} ciudad - Nombre de la ciudad a mostrar en el encabezado.
         * @param {string} pais - Nombre del país (cadena vacía si no aplica).
         * @param {object} datosAPI - Respuesta JSON completa de la API de Open-Meteo.
         * @param {object} datosAPI.current - Datos meteorológicos del momento actual.
         * @param {number} datosAPI.current.temperature_2m - Temperatura actual en °C.
         * @param {number} datosAPI.current.weather_code - Código WMO del estado del tiempo.
         * @param {number} datosAPI.current.relative_humidity_2m - Humedad relativa en %.
         * @param {number} datosAPI.current.apparent_temperature - Sensación térmica en °C.
         * @param {number} datosAPI.current.wind_speed_10m - Velocidad del viento en km/h.
         * @param {number} datosAPI.current.wind_direction_10m - Dirección del viento en grados (0-360).
         * @param {number} datosAPI.current.uv_index - Índice UV actual.
         * @param {object} datosAPI.daily - Datos del pronóstico diario de 5 días.
         * @param {string[]} datosAPI.daily.time - Arreglo de fechas ISO del pronóstico.
         * @param {number[]} datosAPI.daily.weather_code - Códigos WMO por día.
         * @param {number[]} datosAPI.daily.temperature_2m_max - Temperaturas máximas diarias en °C.
         * @param {number[]} datosAPI.daily.temperature_2m_min - Temperaturas mínimas diarias en °C.
         * @param {number[]} datosAPI.daily.precipitation_probability_max - Probabilidad máxima
         *   de precipitación por día en % (0-100).
         * @returns {void}
         *
         * @example
         * renderizarDashboard('Cali', 'Colombia', datosAPI);
         * renderizarDashboard('Tu ubicación', '', datosAPI); // Desde GPS sin país
         */
        function renderizarDashboard(ciudad, pais, datosAPI) {
            const c = datosAPI.current;
            const condicion = resolverCodigo(c.weather_code);

            aplicarFondoDinamico(c.weather_code);

            const uv = c.uv_index ?? 0;
            const nivelUV = uv <= 2 ? 'Bajo'
                          : uv <= 5 ? 'Moderado'
                          : uv <= 7 ? 'Alto'
                          : uv <= 10 ? 'Muy alto'
                          : 'Extremo';

            const direccionViento  = gradosACardinal(c.wind_direction_10m ?? 0);
            const horaActualizada  = new Date().toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });

            const pronosticoHTML = datosAPI.daily.time.map((fecha, i) => {
                const cod  = resolverCodigo(datosAPI.daily.weather_code[i]);
                const prob = datosAPI.daily.precipitation_probability_max?.[i] ?? 0;
                return `
                    <div class="forecast-card">
                        <div class="forecast-day">${i === 0 ? 'Hoy' : diaCorto(fecha)}</div>
                        <div class="forecast-emoji">${cod.emoji}</div>
                        <div class="forecast-temp-max">${Math.round(datosAPI.daily.temperature_2m_max[i])}°</div>
                        <div class="forecast-temp-min">${Math.round(datosAPI.daily.temperature_2m_min[i])}°</div>
                        ${prob > 0 ? `<div class="forecast-precip">💧 ${prob}%</div>` : ''}
                    </div>`;
            }).join('');

            dashboardBody.innerHTML = `
                <div class="main-content">
                    <div class="current-weather">
                        <div class="city-name">${ciudad}${pais ? ', ' + pais : ''}</div>
                        <div class="current-date">${formatearFechaLarga(datosAPI.daily.time[0])}</div>
                        <div class="last-updated">
                            Actualizado a las ${horaActualizada}
                            <button class="btn-refresh" onclick="refrescar()" title="Actualizar datos">↻</button>
                        </div>
                        <div class="weather-emoji">${condicion.emoji}</div>
                        <div class="temperature-main">${Math.round(c.temperature_2m)}°C</div>
                        <div class="weather-description">${condicion.texto}</div>
                    </div>
                    <div class="details-grid">
                        <div class="detail-card">
                            <div class="detail-label">Humedad</div>
                            <div class="detail-icon">💧</div>
                            <div class="detail-value">${c.relative_humidity_2m}%</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-label">Sensación térmica</div>
                            <div class="detail-icon">🌡️</div>
                            <div class="detail-value">${Math.round(c.apparent_temperature)}°C</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-label">Viento</div>
                            <div class="detail-icon">💨</div>
                            <div class="detail-value">${Math.round(c.wind_speed_10m)} <span class="detail-sub">km/h</span></div>
                            <div class="detail-dir">${direccionViento}</div>
                        </div>
                        <div class="detail-card">
                            <div class="detail-label">Índice UV</div>
                            <div class="detail-icon">🔆</div>
                            <div class="detail-value">${uv.toFixed(1)} <span class="detail-sub">${nivelUV}</span></div>
                        </div>
                    </div>
                </div>
                <div class="forecast-section">
                    <div class="forecast-title">Pronóstico 5 días</div>
                    <div class="forecast-row">${pronosticoHTML}</div>
                </div>`;
        }

        // ============================================================
        //  FLUJOS DE BÚSQUEDA
        // ============================================================

        /**
         * Flujo principal de búsqueda por nombre de ciudad: cierra el dropdown, muestra
         * el estado de carga, obtiene geocodificación y pronóstico, y renderiza el dashboard.
         * Actualiza el valor del input con la etiqueta normalizada `"Ciudad, País"`.
         * Captura cualquier error y lo muestra en el UI sin propagar la excepción.
         *
         * @async
         * @param {string} nombreCiudad - Nombre (y opcionalmente país) de la ciudad a buscar,
         *   ej. `'Tokio'` o `'Tokio, Japón'`.
         * @returns {Promise<void>}
         *
         * @example
         * await buscarCiudad('Tokio, Japón');
         * await buscarCiudad('Nueva York');
         */
        async function buscarCiudad(nombreCiudad) {
            cerrarSugerencias();
            limpiarFondoCiudad();
            mostrarCargando(`Buscando "${nombreCiudad}"…`);
            try {
                const { ubicacion, datos } = await obtenerClima(nombreCiudad);
                renderizarDashboard(ubicacion.ciudad, ubicacion.pais, datos);
                const etiqueta = ubicacion.pais
                    ? `${ubicacion.ciudad}, ${ubicacion.pais}`
                    : ubicacion.ciudad;
                searchInput.value = etiqueta;
                guardarEnHistorial(ubicacion.ciudad, ubicacion.pais);
                ultimaConsulta = { latitud: ubicacion.latitud, longitud: ubicacion.longitud, ciudad: ubicacion.ciudad, pais: ubicacion.pais };
                actualizarBtnAgregarComparar();
                cargarImagenesCiudad(ubicacion.ciudad); // asíncrono, no bloquea
            } catch (err) {
                console.error('[buscarCiudad]', err);
                mostrarError(err.message);
            }
        }

        /**
         * Búsqueda optimizada que usa un candidato ya resuelto desde el dropdown de
         * autocompletado, evitando una segunda llamada a la API de geocodificación al
         * reutilizar las coordenadas ya disponibles en el objeto candidato.
         *
         * @async
         * @param {object} candidato - Objeto candidato crudo devuelto por `buscarCandidatos`.
         * @param {string} candidato.name - Nombre de la ciudad.
         * @param {number} candidato.latitude - Latitud de la ciudad.
         * @param {number} candidato.longitude - Longitud de la ciudad.
         * @param {string} [candidato.country] - Nombre del país (opcional).
         * @returns {Promise<void>}
         *
         * @example
         * await buscarCandidatoDirecto({
         *   name: 'Sevilla', latitude: 37.38, longitude: -5.97, country: 'España'
         * });
         */
        async function buscarCandidatoDirecto(candidato) {
            cerrarSugerencias();
            limpiarFondoCiudad();
            const etiqueta = candidato.country
                ? `${candidato.name}, ${candidato.country}`
                : candidato.name;
            searchInput.value = etiqueta;
            mostrarCargando(`Buscando "${candidato.name}"…`);
            try {
                const datos = await obtenerClimaPorCoordenadas(candidato.latitude, candidato.longitude);
                renderizarDashboard(candidato.name, candidato.country ?? '', datos);
                guardarEnHistorial(candidato.name, candidato.country ?? '');
                ultimaConsulta = { latitud: candidato.latitude, longitud: candidato.longitude, ciudad: candidato.name, pais: candidato.country ?? '' };
                actualizarBtnAgregarComparar();
                cargarImagenesCiudad(candidato.name); // asíncrono, no bloquea
            } catch (err) {
                console.error('[buscarCandidatoDirecto]', err);
                mostrarError(err.message);
            }
        }

        /**
         * Flujo de búsqueda por GPS: resuelve el nombre de ciudad mediante geocodificación
         * inversa (Nominatim) y obtiene el pronóstico del clima para las coordenadas dadas.
         * Captura cualquier error y lo muestra en el UI sin propagar la excepción.
         *
         * @async
         * @param {number} lat - Latitud obtenida del API `navigator.geolocation`.
         * @param {number} lon - Longitud obtenida del API `navigator.geolocation`.
         * @returns {Promise<void>}
         *
         * @example
         * navigator.geolocation.getCurrentPosition(
         *   (pos) => buscarPorCoordenadas(pos.coords.latitude, pos.coords.longitude)
         * );
         */
        async function buscarPorCoordenadas(lat, lon) {
            limpiarFondoCiudad();
            mostrarCargando('Obteniendo clima por GPS…');
            try {
                const nombreCiudad = await ciudadDesdeCoordenadas(lat, lon);
                const datos = await obtenerClimaPorCoordenadas(lat, lon);
                renderizarDashboard(nombreCiudad, '', datos);
                searchInput.value = nombreCiudad;
                ultimaConsulta = { latitud: lat, longitud: lon, ciudad: nombreCiudad, pais: '' };
                actualizarBtnAgregarComparar();
                cargarImagenesCiudad(nombreCiudad); // asíncrono, no bloquea
            } catch (err) {
                console.error('[buscarPorCoordenadas]', err);
                mostrarError('No se pudo obtener el clima por GPS: ' + err.message);
            }
        }

        // ============================================================
        //  AUTOCOMPLETADO — Dropdown de sugerencias
        // ============================================================
        const searchWrapper = document.querySelector('.search-wrapper');
        const searchInput   = document.getElementById('search-input');

        let sugerenciasActuales = [];  // Resultados crudos de la última consulta
        let indiceActivo        = -1;  // Índice resaltado con teclado
        let timerDebounce       = null;

        /**
         * Elimina el dropdown de sugerencias del DOM si existe, reinicia el índice de
         * navegación por teclado a `-1` y actualiza el atributo ARIA `aria-expanded`
         * del input a `false` para accesibilidad.
         *
         * @returns {void}
         *
         * @example
         * cerrarSugerencias(); // Cierra el dropdown y restaura el estado de navegación
         */
        function cerrarSugerencias() {
            const lista = searchWrapper.querySelector('.suggestions-list');
            if (lista) lista.remove();
            indiceActivo = -1;
            searchInput.setAttribute('aria-expanded', 'false');
        }

        /**
         * Construye e inserta en el DOM el dropdown de sugerencias de autocompletado
         * a partir del arreglo `sugerenciasActuales`. Cada ítem muestra un icono de pin,
         * el nombre de la ciudad y un subtítulo con región y país. Asigna el evento
         * `mousedown` (en lugar de `click`) para evitar que el `blur` del input
         * se dispare antes de procesar la selección.
         *
         * @returns {void}
         *
         * @example
         * sugerenciasActuales = await buscarCandidatos('Bar', 5);
         * renderizarSugerencias(); // Inserta lista con hasta 5 sugerencias en el DOM
         */
        function renderizarSugerencias() {
            cerrarSugerencias();
            if (!sugerenciasActuales.length) return;

            searchInput.setAttribute('aria-expanded', 'true');
            const lista = document.createElement('ul');
            lista.className = 'suggestions-list';
            lista.setAttribute('role', 'listbox');

            sugerenciasActuales.forEach((c, i) => {
                const li = document.createElement('li');
                li.className = 'suggestion-item';
                li.setAttribute('role', 'option');
                li.dataset.index = i;

                // Subtítulo: admin1 (estado/provincia) + país
                const extra = [c.admin1, c.country].filter(Boolean).join(', ');

                li.innerHTML = `
                    <span class="sug-icon">📍</span>
                    <span class="sug-city">${c.name}</span>
                    <span class="sug-extra">${extra}</span>`;

                li.addEventListener('mousedown', (e) => {
                    // mousedown en lugar de click para que no se dispare el blur del input primero
                    e.preventDefault();
                    buscarCandidatoDirecto(sugerenciasActuales[i]);
                });

                lista.appendChild(li);
            });

            searchWrapper.appendChild(lista);
        }

        /**
         * Sincroniza el resaltado visual del dropdown con el valor de `indiceActivo`,
         * añadiendo la clase CSS `active` al ítem correspondiente y quitándola del resto.
         * Diseñada para ser invocada tras cada pulsación de `ArrowUp` o `ArrowDown`.
         *
         * @returns {void}
         *
         * @example
         * indiceActivo = 2;
         * actualizarItemActivo(); // Resalta el tercer ítem (.suggestion-item) del dropdown
         */
        function actualizarItemActivo() {
            const items = searchWrapper.querySelectorAll('.suggestion-item');
            items.forEach((el, i) => el.classList.toggle('active', i === indiceActivo));
        }

        // Input: dispara búsqueda de sugerencias con debounce de 300 ms
        searchInput.addEventListener('input', () => {
            clearTimeout(timerDebounce);
            const query = searchInput.value.trim();

            if (query.length < 2) {
                cerrarSugerencias();
                // Al borrar completamente el input, mostrar historial si existe
                if (query.length === 0) renderizarHistorial();
                return;
            }

            timerDebounce = setTimeout(async () => {
                try {
                    sugerenciasActuales = await buscarCandidatos(query, 7);
                    renderizarSugerencias();
                } catch {
                    cerrarSugerencias();
                }
            }, 300);
        });

        // Mostrar historial al enfocar el input si no hay texto suficiente para autocomplete
        searchInput.addEventListener('focus', () => {
            if (searchInput.value.trim().length < 2) {
                renderizarHistorial();
            }
        });

        // Teclado: navegación y selección desde el dropdown
        searchInput.addEventListener('keydown', (e) => {
            const items = searchWrapper.querySelectorAll('.suggestion-item');

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                indiceActivo = Math.min(indiceActivo + 1, items.length - 1);
                actualizarItemActivo();
                return;
            }
            if (e.key === 'ArrowUp') {
                e.preventDefault();
                indiceActivo = Math.max(indiceActivo - 1, -1);
                actualizarItemActivo();
                return;
            }
            if (e.key === 'Escape') {
                cerrarSugerencias();
                return;
            }
            if (e.key === 'Enter') {
                e.preventDefault();
                if (indiceActivo >= 0 && sugerenciasActuales[indiceActivo]) {
                    buscarCandidatoDirecto(sugerenciasActuales[indiceActivo]);
                } else {
                    const query = searchInput.value.trim();
                    if (query) buscarCiudad(query);
                }
            }
        });

        // Cerrar dropdown al perder el foco (sin interferir con el mousedown del item)
        searchInput.addEventListener('blur', () => {
            setTimeout(cerrarSugerencias, 150);
        });

        // Cerrar dropdown al hacer clic fuera del componente
        document.addEventListener('click', (e) => {
            if (!searchWrapper.contains(e.target)) cerrarSugerencias();
        });

        // ============================================================
        //  BOTÓN TEMA CLARO/OSCURO
        // ============================================================
        document.getElementById('btn-tema').addEventListener('click', () => {
            const actual = document.documentElement.dataset.tema ?? 'light';
            aplicarTema(actual === 'dark' ? 'light' : 'dark');
        });

        // ============================================================
        //  BOTÓN GPS
        // ============================================================
        document.getElementById('btn-gps').addEventListener('click', () => {
            if (!navigator.geolocation) {
                mostrarError('Tu navegador no soporta geolocalización.');
                return;
            }
            mostrarCargando('Solicitando permiso de ubicación…');
            navigator.geolocation.getCurrentPosition(
                (pos) => buscarPorCoordenadas(pos.coords.latitude, pos.coords.longitude),
                ()    => mostrarError('Permiso de ubicación denegado o tiempo de espera agotado.'),
                { timeout: 10000 }
            );
        });

        // ============================================================
        //  CARRUSEL DE IMÁGENES DE FONDO — Wikipedia REST API
        //  Sin API key. CORS abierto. Imágenes curadas editorialmente.
        //  Endpoints usados:
        //    · page/summary/{ciudad}    → imagen principal + descripción + extracto
        //    · page/media-list/{ciudad} → galería de imágenes del artículo
        // ============================================================

        /** Imágenes cargadas para la ciudad actual. */
        let imagenesFondo = [];
        /** Índice de la imagen actualmente visible. */
        let indiceImagenFondo = 0;
        /** Referencia al setInterval activo; null cuando el carrusel está detenido. */
        let temporizadorFondo = null;
        /** Intervalo de rotación automática: 60 segundos. */
        const INTERVALO_CARRUSEL_MS = 60_000;

        /**
         * Consulta la Wikipedia REST API para obtener imágenes representativas de una ciudad.
         * Usa dos endpoints en secuencia:
         *   1. `page/summary/{ciudad}` — imagen principal, descripción y extracto del artículo.
         *   2. `page/media-list/{titulo_canonico}` — galería del artículo filtrada por fotografías reales.
         *
         * Filtra el resultado para retener solo imágenes marcadas como `showInGallery`,
         * descarta archivos SVG y elimina duplicados respecto a la imagen principal.
         *
         * @async
         * @param {string} ciudad - Nombre de la ciudad a buscar en Wikipedia (en cualquier idioma).
         * @returns {Promise<Array<{url: string, titulo: string, ubicacion: string, extracto: string}>>}
         *   Arreglo de objetos de imagen listos para el carrusel. Puede estar vacío si Wikipedia
         *   no dispone de imágenes para la ciudad solicitada.
         */
        async function obtenerImagenesWikipedia(ciudad) {
            const base = 'https://en.wikipedia.org/api/rest_v1/page';

            // Paso 1: summary para obtener título canónico + descripción + imagen principal
            let summary = null;
            try {
                const res = await fetch(`${base}/summary/${encodeURIComponent(ciudad)}`);
                if (res.ok) summary = await res.json();
            } catch { /* ignore: se usará fallback vacío */ }

            const canonicalTitle = summary?.title ?? ciudad;
            const ubicacion      = summary?.description ?? ciudad;
            // Dos primeras frases del extracto como descripción editorial
            const extracto = summary?.extract
                ? summary.extract.split('. ').slice(0, 2).join('. ').trim() + '.'
                : '';

            const imagenes = [];

            // Imagen principal del artículo (originalimage tiene mayor resolución)
            const urlPrincipal = summary?.originalimage?.source ?? summary?.thumbnail?.source;
            if (urlPrincipal) {
                imagenes.push({ url: urlPrincipal, titulo: canonicalTitle, ubicacion, extracto });
            }

            // Paso 2: galería del artículo usando el título canónico
            try {
                const res = await fetch(`${base}/media-list/${encodeURIComponent(canonicalTitle)}`);
                if (res.ok) {
                    const media = await res.json();
                    (media.items ?? [])
                        .filter(item =>
                            item.type === 'image' &&
                            item.showInGallery === true &&
                            !item.title?.toLowerCase().endsWith('.svg')
                        )
                        .forEach(item => {
                            // Elegir la URL de mayor resolución del srcset
                            const srcs  = item.srcset ?? [];
                            const mejor = srcs[srcs.length - 1]?.src ?? srcs[0]?.src;
                            if (!mejor) return;

                            const url = mejor.startsWith('//') ? `https:${mejor}` : mejor;
                            if (imagenes.some(img => img.url === url)) return; // evitar duplicado

                            const titulo = item.caption?.text
                                ?? item.title?.replace(/^File:/, '').replace(/\.\w+$/, '').replace(/_/g, ' ')
                                ?? ciudad;

                            imagenes.push({ url, titulo, ubicacion, extracto });
                        });
                }
            } catch { /* ignore */ }

            return imagenes;
        }

        /**
         * Aplica la imagen del índice dado como fondo de `#fondo-ciudad` con un efecto
         * de fundido (fade-out → swap → fade-in). Actualiza el caption con los metadatos
         * de la imagen y el contador de posición del carrusel.
         * No hace nada si `imagenesFondo` está vacío.
         *
         * @param {number} indice - Índice dentro de `imagenesFondo` a mostrar.
         */
        function mostrarImagenFondo(indice) {
            if (!imagenesFondo.length) return;
            const fondoEl    = document.getElementById('fondo-ciudad');
            const captionEl  = document.getElementById('fondo-caption');
            const tituloEl   = document.getElementById('caption-titulo');
            const ubicEl     = document.getElementById('caption-ubicacion');
            const descEl     = document.getElementById('caption-descripcion');
            const contadorEl = document.getElementById('caption-contador');
            const prevBtn    = document.getElementById('btn-fondo-prev');
            const nextBtn    = document.getElementById('btn-fondo-next');
            if (!fondoEl) return;

            const img = imagenesFondo[indice];

            // Fundido: ocultar → cambiar imagen → mostrar
            fondoEl.style.opacity = '0';
            setTimeout(() => {
                fondoEl.style.backgroundImage = `url("${img.url}")`;
                fondoEl.style.opacity = '1';
            }, 400);

            // Mostrar caption
            if (captionEl)  captionEl.hidden = false;
            if (tituloEl)   tituloEl.textContent   = img.titulo;
            if (ubicEl)     ubicEl.textContent      = img.ubicacion;
            if (descEl)     descEl.textContent      = img.extracto;
            if (contadorEl) contadorEl.textContent  = `${indice + 1} / ${imagenesFondo.length}`;

            // Ocultar controles de navegación si solo hay 1 imagen
            const mostrarNav = imagenesFondo.length > 1;
            if (prevBtn) prevBtn.style.display = mostrarNav ? '' : 'none';
            if (nextBtn) nextBtn.style.display = mostrarNav ? '' : 'none';
            if (contadorEl) contadorEl.style.display = mostrarNav ? '' : 'none';
        }

        /**
         * Avanza el carrusel al siguiente índice de forma circular y muestra la imagen.
         */
        function avanzarImagenFondo() {
            indiceImagenFondo = (indiceImagenFondo + 1) % imagenesFondo.length;
            mostrarImagenFondo(indiceImagenFondo);
        }

        /**
         * Retrocede el carrusel al índice anterior de forma circular y muestra la imagen.
         */
        function retrocederImagenFondo() {
            indiceImagenFondo = (indiceImagenFondo - 1 + imagenesFondo.length) % imagenesFondo.length;
            mostrarImagenFondo(indiceImagenFondo);
        }

        /**
         * Inicia la rotación automática del carrusel con el intervalo `INTERVALO_CARRUSEL_MS`.
         * Detiene cualquier temporizador previo antes de crear uno nuevo para garantizar
         * que nunca coexistan múltiples intervalos concurrentes.
         */
        function iniciarCarrusel() {
            detenerCarrusel();
            if (imagenesFondo.length > 1) {
                temporizadorFondo = setInterval(avanzarImagenFondo, INTERVALO_CARRUSEL_MS);
            }
        }

        /**
         * Detiene la rotación automática limpiando el `setInterval` activo.
         * Seguro de llamar aunque el carrusel no esté activo (`temporizadorFondo` null).
         */
        function detenerCarrusel() {
            if (temporizadorFondo !== null) {
                clearInterval(temporizadorFondo);
                temporizadorFondo = null;
            }
        }

        /**
         * Limpia por completo el estado del carrusel: detiene el temporizador,
         * vacía el arreglo de imágenes, quita el `background-image` del elemento
         * de fondo y oculta la barra de caption.
         * Debe llamarse al inicio de cada nueva búsqueda de ciudad para evitar
         * que las imágenes de la ciudad anterior persistan.
         */
        function limpiarFondoCiudad() {
            detenerCarrusel();
            imagenesFondo     = [];
            indiceImagenFondo = 0;
            const fondoEl   = document.getElementById('fondo-ciudad');
            const captionEl = document.getElementById('fondo-caption');
            if (fondoEl) {
                fondoEl.style.backgroundImage = '';
                fondoEl.classList.remove('con-imagen');
                fondoEl.style.opacity = '1';
            }
            if (captionEl) captionEl.hidden = true;
        }

        /**
         * Orquesta la carga de imágenes desde Wikipedia para la ciudad dada,
         * activa el modo `con-imagen` en el elemento de fondo y arranca el carrusel.
         * Se llama de forma asíncrona tras renderizar el dashboard: no bloquea la UI.
         * En caso de fallo o ausencia de imágenes, el fondo meteorológico wx-* sigue activo
         * como fallback visual transparente para el usuario.
         *
         * @async
         * @param {string} ciudad - Nombre de la ciudad cuyas imágenes se cargarán.
         */
        async function cargarImagenesCiudad(ciudad) {
            try {
                const imgs = await obtenerImagenesWikipedia(ciudad);
                if (!imgs.length) return; // sin imágenes: el gradiente wx-* es el fondo

                imagenesFondo     = imgs;
                indiceImagenFondo = 0;

                const fondoEl = document.getElementById('fondo-ciudad');
                if (fondoEl) fondoEl.classList.add('con-imagen');

                mostrarImagenFondo(0);
                iniciarCarrusel();
            } catch {
                // Fallo silencioso: el fondo meteorológico wx-* continúa como fallback.
            }
        }

        /**
         * Registra los listeners de los botones de navegación del carrusel (anterior/siguiente).
         * Al navegar manualmente se reinicia el temporizador para evitar un salto automático
         * inmediato después de una acción del usuario.
         * Debe llamarse una sola vez desde `inicializar()`.
         */
        function inicializarCarrusel() {
            document.getElementById('btn-fondo-prev')?.addEventListener('click', () => {
                detenerCarrusel();
                retrocederImagenFondo();
                iniciarCarrusel();
            });
            document.getElementById('btn-fondo-next')?.addEventListener('click', () => {
                detenerCarrusel();
                avanzarImagenFondo();
                iniciarCarrusel();
            });
        }

        // ============================================================
        //  BOTÓN AÑADIR CIUDAD AL COMPARADOR
        // ============================================================

        /**
         * Actualiza el estado `disabled` y el atributo `title` del botón "Añadir al comparador"
         * según si existe una consulta exitosa activa en `ultimaConsulta`.
         */
        function actualizarBtnAgregarComparar() {
            const btn = document.getElementById('btn-agregar-comparar');
            if (!btn) return;
            btn.disabled = !ultimaConsulta;
            btn.title = ultimaConsulta
                ? `Añadir "${ultimaConsulta.ciudad}" al comparador`
                : 'Busca una ciudad primero';
        }

        /**
         * Registra el listener del botón "Añadir al comparador" en la barra de búsqueda.
         * Al hacer clic agrega la ciudad actualmente cargada en el dashboard a la lista
         * de comparación y muestra un feedback visual de confirmación (clase `agregado`
         * durante 1,3 segundos). Si el panel de comparación está oculto y hay al menos
         * 2 ciudades en lista, lo abre automáticamente para que el usuario lo vea.
         * Debe llamarse una sola vez desde `inicializar()`.
         */
        function inicializarBtnAgregarComparar() {
            const btn = document.getElementById('btn-agregar-comparar');
            if (!btn) return;

            btn.addEventListener('click', () => {
                if (!ultimaConsulta) return;
                const etiqueta = ultimaConsulta.pais
                    ? `${ultimaConsulta.ciudad}, ${ultimaConsulta.pais}`
                    : ultimaConsulta.ciudad;

                agregarCiudadAComparacion(etiqueta);
                renderizarChips();

                // Feedback visual en el botón
                btn.classList.add('agregado');
                setTimeout(() => btn.classList.remove('agregado'), 1300);

                // Abrir el panel automáticamente cuando ya hay ≥2 ciudades
                const panel      = document.getElementById('comparar-panel');
                const btnToggle  = document.getElementById('btn-comparar');
                if (panel && panel.hidden && ciudadesComparacion.length >= 2) {
                    panel.hidden = false;
                    btnToggle?.classList.add('activo');
                    btnToggle?.setAttribute('aria-pressed', 'true');
                }
            });
        }

        // ============================================================
        //  COMPARACIÓN DE MÚLTIPLES CIUDADES
        // ============================================================

        /** Máximo de ciudades permitidas en una comparativa simultánea. */
        const MAX_CIUDADES_COMPARAR = 6;

        /** Etiquetas de las ciudades añadidas al modo comparativo. */
        let ciudadesComparacion = [];

        /**
         * Intenta añadir una ciudad a la lista de comparación.
         * Rechaza duplicados (comparación normalizada) y entradas que superan el límite.
         *
         * @param {string} etiqueta - Nombre de ciudad con o sin país, ej. `'Lima, Perú'`.
         * @returns {boolean} true si se añadió; false si era duplicada o la lista estaba llena.
         */
        function agregarCiudadAComparacion(etiqueta) {
            const norm = normalizar(etiqueta);
            if (ciudadesComparacion.some(c => normalizar(c) === norm)) return false;
            if (ciudadesComparacion.length >= MAX_CIUDADES_COMPARAR) return false;
            ciudadesComparacion.push(etiqueta);
            return true;
        }

        /**
         * Elimina la ciudad en la posición `idx` y actualiza los chips del panel.
         *
         * @param {number} idx - Índice de la ciudad en `ciudadesComparacion`.
         */
        function quitarCiudadDeComparacion(idx) {
            ciudadesComparacion.splice(idx, 1);
            renderizarChips();
        }

        /**
         * Redibuja los chips (etiquetas con botón de cierre) de las ciudades añadidas
         * y actualiza el estado disabled del botón de ejecutar (requiere mínimo 2 ciudades).
         */
        function renderizarChips() {
            const chips       = document.getElementById('comparar-chips');
            const btnEjecutar = document.getElementById('btn-ejecutar-comparar');
            if (!chips || !btnEjecutar) return;

            chips.innerHTML = ciudadesComparacion.map((etiqueta, i) => `
                <span class="comparar-chip">
                    ${etiqueta}
                    <button class="comparar-chip-close" data-idx="${i}" aria-label="Quitar ${etiqueta}">✕</button>
                </span>`).join('');

            chips.querySelectorAll('.comparar-chip-close').forEach(btn => {
                btn.addEventListener('click', () => quitarCiudadDeComparacion(+btn.dataset.idx));
            });

            btnEjecutar.disabled = ciudadesComparacion.length < 2;
        }

        /**
         * Genera e inyecta en `#comparar-resultado` las tarjetas comparativas
         * de todas las ciudades. Usa `Promise.allSettled`, por lo que las ciudades
         * con error se muestran como tarjeta de fallo sin bloquear las exitosas.
         *
         * @param {Array<{status: 'fulfilled'|'rejected', value?, reason?, etiqueta: string}>} resultados
         *   Arreglo enriquecido de Promise.allSettled con la etiqueta original de cada ciudad.
         */
        function renderizarComparacion(resultados) {
            const contenedor = document.getElementById('comparar-resultado');
            if (!contenedor) return;

            const cardsHTML = resultados.map(r => {
                if (r.status === 'rejected') {
                    return `
                        <div class="comp-card comp-card-error">
                            <div class="comp-ciudad">${r.etiqueta}</div>
                            <div class="comp-error-msg">⚠️ ${r.reason?.message ?? 'Error desconocido'}</div>
                        </div>`;
                }

                const { ubicacion, datos } = r.value;
                const c        = datos.current;
                const condicion = resolverCodigo(c.weather_code);
                const uv       = c.uv_index ?? 0;

                return `
                    <div class="comp-card">
                        <div class="comp-ciudad">${ubicacion.ciudad}${ubicacion.pais ? ', ' + ubicacion.pais : ''}</div>
                        <div class="comp-emoji">${condicion.emoji}</div>
                        <div class="comp-temp">${Math.round(c.temperature_2m)}°C</div>
                        <div class="comp-condicion">${condicion.texto}</div>
                        <div class="comp-detalles">
                            <div class="comp-detalle">
                                <span class="comp-detalle-icon">💧</span>
                                <span>${c.relative_humidity_2m}%</span>
                                <span class="comp-detalle-label">Humedad</span>
                            </div>
                            <div class="comp-detalle">
                                <span class="comp-detalle-icon">🌡️</span>
                                <span>${Math.round(c.apparent_temperature)}°C</span>
                                <span class="comp-detalle-label">Sensación</span>
                            </div>
                            <div class="comp-detalle">
                                <span class="comp-detalle-icon">💨</span>
                                <span>${Math.round(c.wind_speed_10m)} km/h</span>
                                <span class="comp-detalle-label">Viento</span>
                            </div>
                            <div class="comp-detalle">
                                <span class="comp-detalle-icon">🔆</span>
                                <span>${uv.toFixed(1)}</span>
                                <span class="comp-detalle-label">Índice UV</span>
                            </div>
                        </div>
                    </div>`;
            }).join('');

            contenedor.innerHTML = `<div class="comp-grid">${cardsHTML}</div>`;
        }

        /**
         * Lanza en paralelo la obtención del clima de todas las ciudades de la lista
         * usando `Promise.allSettled` para tolerar fallos individuales. Muestra un
         * estado de carga mientras procesa y vuelve a habilitar el botón al terminar.
         *
         * @async
         * @returns {Promise<void>}
         */
        async function ejecutarComparacion() {
            const contenedor  = document.getElementById('comparar-resultado');
            const btnEjecutar = document.getElementById('btn-ejecutar-comparar');
            if (!contenedor || !btnEjecutar) return;

            contenedor.innerHTML = '<div class="loading-overlay">Obteniendo datos de todas las ciudades…</div>';
            btnEjecutar.disabled = true;

            const promesas = ciudadesComparacion.map(etiqueta =>
                obtenerClima(etiqueta).then(result => ({ ...result, etiqueta }))
            );
            const resultados = await Promise.allSettled(promesas);
            // Enriquecer con la etiqueta original para poder mostrarla en tarjetas de error.
            const anotados = resultados.map((r, i) => ({ ...r, etiqueta: ciudadesComparacion[i] }));

            renderizarComparacion(anotados);
            btnEjecutar.disabled = ciudadesComparacion.length < 2;
        }

        /**
         * Registra todos los listeners del panel de comparación y el botón toggle.
         * Debe llamarse una sola vez desde `inicializar()`.
         */
        function inicializarComparacion() {
            const btnComparar  = document.getElementById('btn-comparar');
            const panel        = document.getElementById('comparar-panel');
            const inputComp    = document.getElementById('comparar-input');
            const btnAgregar   = document.getElementById('btn-agregar-ciudad');
            const btnEjecutar  = document.getElementById('btn-ejecutar-comparar');
            if (!btnComparar || !panel || !inputComp || !btnAgregar || !btnEjecutar) return;

            // Toggle visibilidad del panel
            btnComparar.addEventListener('click', () => {
                const estabVisible = !panel.hidden;
                panel.hidden = estabVisible;
                btnComparar.classList.toggle('activo', !estabVisible);
                btnComparar.setAttribute('aria-pressed', String(!estabVisible));

                if (estabVisible) {
                    // Al cerrar: limpiar todo el estado de comparación
                    ciudadesComparacion = [];
                    renderizarChips();
                    document.getElementById('comparar-resultado').innerHTML = '';
                    inputComp.value = '';
                } else {
                    inputComp.focus();
                }
            });

            // Añadir ciudad al presionar el botón o pulsar Enter en el input
            const intentarAgregar = () => {
                const etiqueta = inputComp.value.trim();
                if (!etiqueta) return;

                const agregada = agregarCiudadAComparacion(etiqueta);
                if (agregada) {
                    renderizarChips();
                    inputComp.value = '';
                    inputComp.focus();
                } else if (ciudadesComparacion.length >= MAX_CIUDADES_COMPARAR) {
                    inputComp.setCustomValidity(`Máximo ${MAX_CIUDADES_COMPARAR} ciudades.`);
                    inputComp.reportValidity();
                    setTimeout(() => inputComp.setCustomValidity(''), 2500);
                }
            };

            btnAgregar.addEventListener('click', intentarAgregar);
            inputComp.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); intentarAgregar(); }
            });

            btnEjecutar.addEventListener('click', ejecutarComparacion);
        }

        // ============================================================
        //  CARGA INICIAL — Detección por IP con fallback
        // ============================================================
        /**
         * Punto de entrada de la aplicación. Detecta automáticamente la ciudad del usuario
         * consultando la API de geolocalización por IP (ipapi.co) con un timeout de 4 segundos.
         * Si la petición falla, se agota el tiempo de espera o la API no devuelve ciudad,
         * carga `'Santiago de Cali'` como ciudad de fallback garantizado.
         *
         * @async
         * @returns {Promise<void>}
         *
         * @example
         * // Invocada automáticamente al finalizar la carga del DOM:
         * inicializar();
         */
        async function inicializar() {
            inicializarTema();
            inicializarCarrusel();
            inicializarBtnAgregarComparar();
            inicializarComparacion();
            const CIUDAD_FALLBACK = 'Santiago de Cali';
            try {
                const ctrl  = new AbortController();
                const timer = setTimeout(() => ctrl.abort(), 4000);
                const res   = await fetch('https://ipapi.co/json/', { signal: ctrl.signal });
                clearTimeout(timer);
                if (!res.ok) throw new Error('ipapi no disponible');
                const ipData = await res.json();
                await buscarCiudad(ipData.city || CIUDAD_FALLBACK);
            } catch {
                await buscarCiudad(CIUDAD_FALLBACK);
            }
        }

        inicializar();
    </script>
